<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevBoard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="files.css/reset.css" />
    <link rel="stylesheet" href="files.css/variables.css" />
    <link rel="stylesheet" href="files.css/layout.css" />
    <link rel="stylesheet" href="files.css/components.css" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <header>
      <h1>DevBoard</h1>
      <nav></nav>
      <button></button>
    </header>

    <!-- Conteúdo principal -->
    <div class="container">
      <main>
        <!-- Saudação -->
        <section class="saudacao">
          <h2>Olá! Bem-vindo(a) ao DevBoard!</h2>
        </section>

        <section class="dashboard">
          <h2>Dashboard</h2>
        </section>
      </main>

      <!-- Coluna Central -->

      <aside class="coluna-central">
        <h2 class="agenda">Sua agenda</h2>
        <section class="card-de-tarefas"><h3>Tarefas</h3></section>
        <section class="card-de-metas"><h3>Metas</h3></section>
        <section class="card-de-insights">
          <h3>Insights</h3>
        </section>
      </aside>

      <!-- Coluna lateral -->
      <aside class="coluna-lateral">
        <h2 class="confira">Confira também:</h2>
        <section class="dicas-lateral">
          <h3>Dicas</h3>
        </section>
        <section class="artigos-uteis">
          <h3>Artigos úteis</h3>
        </section>
      </aside>
    </div>

    <footer></footer>

    <!-- JavaScript -->
    <script src="files.js/main.js" defer></script>
    <script src="files.js/storage.js" defer></script>
    <script src="files.js/ui.js" defer></script>
  </body>
</html>
